      - Functions: ns-harness/functions.md
      - Structs: ns-harness/annotated.md
      - Variables: ns-harness/variables.md
    - Model Wrapper:
      - Files: ns-model/files.md
      - Modules: ns-model/modules.md
      - Functions: ns-model/functions.md
      - Structs: ns-model/annotated.md
      - Variables: ns-model/variables.md
  - Blog:
      - docs/blog/index.md

markdown_extensions:
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      check_paths: true
  - attr_list

plugins:
  - blog:
      blog_dir: docs/blog
  - glightbox
  - mkdoxy:
      full-doc: True
      projects:
        ns-audio:
          src-dirs: neuralspot/neuralspot/ns-audio
          full-doc: True
          doxy-cfg:
            FILE_PATTERNS: "*.h *.c *.cc"
            RECURSIVE: True
            EXTRACT_ALL: No
        ns-ble:
          src-dirs: neuralspot/neuralspot/ns-ble
          full-doc: True
          doxy-cfg:
            FILE_PATTERNS: "*.h *.c *.cc"
            RECURSIVE: True
            EXTRACT_ALL: No
        ns-i2c:
          src-dirs: neuralspot/neuralspot/ns-i2c
          full-doc: True
          doxy-cfg:
            FILE_PATTERNS: "*.h *.c *.cc"
            RECURSIVE: True
            EXTRACT_ALL: No
        ns-spi:
          src-dirs: neuralspot/neuralspot/ns-spi
          full-doc: True
          doxy-cfg:
            FILE_PATTERNS: "*.h *.c *.cc"
            RECURSIVE: True
            EXTRACT_ALL: No
        ns-power:
          src-dirs: neuralspot/neuralspot/ns-peripherals
          full-doc: True
          doxy-cfg:
            FILE_PATTERNS: "*.h *.c *.cc"
            RECURSIVE: True
            EXTRACT_ALL: No
        ns-core:
          src-dirs: neuralspot/neuralspot/ns-core
          full-doc: True
          doxy-cfg:
            FILE_PATTERNS: "*.h *.c *.cc"
            RECURSIVE: True
            EXTRACT_ALL: No
        ns-rpc:
          src-dirs: neuralspot/neuralspot/ns-rpc
          full-doc: True
          doxy-cfg:
            FILE_PATTERNS: "*.h *.c *.cc"
            RECURSIVE: True
            EXTRACT_ALL: No
        ns-utils:
          src-dirs: neuralspot/neuralspot/ns-utils
          full-doc: True
          doxy-cfg:
            FILE_PATTERNS: "*.h *.c *.cc"
            RECURSIVE: True
            EXTRACT_ALL: No
        ns-harness:
          src-dirs: neuralspot/neuralspot/ns-harness
          full-doc: True
          doxy-cfg:
            FILE_PATTERNS: "*.h *.c *.cc"
            RECURSIVE: True
            EXTRACT_ALL: No
        ns-model:
          src-dirs: neuralspot/neuralspot/ns-model
          full-doc: True
          doxy-cfg:
            FILE_PATTERNS: "*.h *.c *.cc"
            RECURSIVE: True
            EXTRACT_ALL: No
        ns-camera:
          src-dirs: neuralspot/neuralspot/ns-camera
          full-doc: True
          doxy-cfg:
            FILE_PATTERNS: "*.h *.c *.cc"
            RECURSIVE: True
            EXTRACT_ALL: No

hooks:
  - neuralspot/docs/hooks/legacy_pointers.py

theme:
  name: material
  custom_dir: neuralspot/docs/overrides
  favicon: docs/images/favicon.png
  logo: docs/images/favicon.png
  icon:
      repo: fontawesome/brands/github-alt
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme)"
      primary: cyan
      accent: indigo
      toggle:
        icon: material/brightness-auto
        name: Use system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: cyan
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to light theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: cyan
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to dark theme
  features:
    - content.tabs.link

extra_css:
  - docs/css/custom.css

