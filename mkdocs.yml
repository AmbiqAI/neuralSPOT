site_name: neuralSPOT
site_dir: ./site
docs_dir: ./neuralspot
site_description: Ambiq neuralSPOT - an AI SDK designed specifically for Ambiq's ultra-low power MCUs
repo_name: AmbiqAI/neuralSPOT
repo_url: https://github.com/AmbiqAI/neuralSPOT
site_url: https://ambiqai.github.io/neuralSPOT/
use_directory_urls: False

# The site publishes only the landing page and the assets it uses.
# docs/hooks/redirects.py writes a redirect stub at every URL the full
# documentation site published. exclude_docs also filters theme files, so
# /assets/ (theme CSS and JavaScript) must stay included; anything committed
# under a root assets/ directory would be published too.
exclude_docs: |
  /*
  !/index.md
  !/assets/
  !/docs/images/favicon.png
  !/docs/images/neuralspot-banner.png
  !/docs/images/neuralspot-banner-dark.png
  !/docs/css/custom.css

markdown_extensions:
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      check_paths: true
  - attr_list

plugins:
  - glightbox

hooks:
  - neuralspot/docs/hooks/redirects.py

theme:
  name: material
  favicon: docs/images/favicon.png
  logo: docs/images/favicon.png
  icon:
      repo: fontawesome/brands/github-alt
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme)"
      primary: cyan
      accent: indigo
      toggle:
        icon: material/brightness-auto
        name: Use system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: cyan
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to light theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: cyan
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to dark theme
  features:
    - content.tabs.link

extra_css:
  - docs/css/custom.css

extra:
  # Redirect targets by name, used by legacy_pointers.
  # docs/hooks/redirects.py resolves and validates them.
  legacy_links:
    nsx: {title: "neuralSPOT-X", url: "https://ambiqai.github.io/neuralspotx/"}
    nsx_getting_started: {title: "Getting started", url: "https://ambiqai.github.io/neuralspotx/getting-started/"}
    nsx_install_windows: {title: "neuralSPOT-X Windows install", url: "https://ambiqai.github.io/neuralspotx/getting-started/install/windows/"}
    nsx_install_linux: {title: "neuralSPOT-X Linux install", url: "https://ambiqai.github.io/neuralspotx/getting-started/install/linux/"}
    nsx_guides: {title: "neuralSPOT-X guides", url: "https://ambiqai.github.io/neuralspotx/guides/"}
    nsx_debug_vscode: {title: "Debug from VS Code", url: "https://ambiqai.github.io/neuralspotx/guides/apps/debug-vscode/"}
    nsx_itm_pcsamp: {title: "ITM PC sampling", url: "https://ambiqai.github.io/neuralspotx/guides/system/itm-pc-sampling/"}
    nsx_examples: {title: "neuralSPOT-X examples", url: "https://ambiqai.github.io/neuralspotx/guides/examples/"}
    nsx_ex_pmu_profiling: {title: "pmu_profiling example", url: "https://ambiqai.github.io/neuralspotx/guides/examples/pmu_profiling/"}
    nsx_ex_kws_infer: {title: "kws_infer example", url: "https://ambiqai.github.io/neuralspotx/guides/examples/kws_infer/"}
    nsx_ex_usb_rpc: {title: "usb_rpc example", url: "https://ambiqai.github.io/neuralspotx/guides/examples/usb_rpc/"}
    nsx_module_catalog: {title: "neuralSPOT-X module catalog", url: "https://ambiqai.github.io/neuralspotx/modules/catalog/"}
    helia_dsp: {title: "heliaDSP", url: "https://ambiqai.github.io/helia-dsp/"}
    nsx_reference: {title: "neuralSPOT-X reference", url: "https://ambiqai.github.io/neuralspotx/reference/"}
    hpx: {title: "heliaPROFILER", url: "https://ambiqai.github.io/helia-profiler/"}
    helia_rt: {title: "heliaRT", url: "https://ambiqai.github.io/helia-rt/"}
