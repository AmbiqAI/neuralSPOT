    nsx_tflite_micro: {title: "nsx-tflite-micro", url: "https://github.com/AmbiqAI/nsx-tflite-micro"}
  # Where each page in docs/hooks/redirect_pages.tsv redirects: the link of the
  # matching entry. A page matches by exact path, or by prefix when the entry
  # ends in "/"; the first match wins, so an entry with link: null also shields
  # its pages from a broader prefix below it. Pages whose entry has link: null,
  # or that no entry matches, redirect to the landing page.
  legacy_pointers:
    - page: "docs/ai_at_ambiq.md"
